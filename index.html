const icon=n=>demoIcons[n]||demoIcons['sun'];
const link=(label='查看全部',page='')=>`<button class="cs-link" ${page?`data-page="${page}"`:`data-detail="${label}"`}>${label}${icon('chevron-right')}</button>`;
const head=(title,desc='',action='')=>`<div class="cs-panel-head"><div><h2>${title}</h2>${desc?`<small>${desc}</small>`:''}</div>${action}</div>`;
const panel=(title,content,desc='',action='')=>`<section class="cs-panel">${head(title,desc,action)}${content}</section>`;
const progress=(n)=>`<div class="cs-track"><span style="width:${n}%"></span></div>`;
const tag=(t,c='lavender')=>`<span class="cs-tag ${c}">${t}</span>`;
const check=(title,desc='',done=false)=>`<label class="cs-check"><input type="checkbox" ${done?'checked':''}><span><b>${title}</b>${desc?`<small>${desc}</small>`:''}</span></label>`;
const bars=(vals=[34,48,40,65,78,24,32])=>`<div class="cs-barchart">${vals.map((h,i)=>`<div><i style="height:${h}px"></i>${['一','二','三','四','五','六','日'][i]}</div>`).join('')}</div>`;
const table=(heads,rows)=>`<div class="cs-table-wrap"><table class="cs-table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<button data-detail="${c.replace(/<[^>]*>/g,'')}">${c}</button>`:c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const tabs=(items,key,selected)=>`<div class="cs-tabs">${items.map(([k,t])=>`<button data-switch="${key}" data-value="${k}" aria-pressed="${selected===k}">${t}</button>`).join('')}</div>`;
const miniCal=()=>panel('十月概览',`<div class="cs-row"><b>2026 · 10</b><small>23 项安排</small></div><div class="cs-miniweek" style="margin-top:15px">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}${Array.from({length:35},(_,i)=>{const d=i-2;return `<button data-detail="${d>0&&d<=31?`10 月 ${d} 日的日程`:'相邻月份日程'}" class="${d===9?'chosen':d<1||d>31?'dim':''}">${d<1?28+i:d>31?d-31:d}</button>`}).join('')}</div><div class="cs-legend"><span>少</span><div><i></i><i></i><i></i></div><span>多</span></div>`);
const agenda=()=>panel('今天的安排',`<div class="cs-agenda"><time>09:00</time><span class="cs-dot"></span><div>工作室项目沟通<small>把关键问题说清楚</small></div></div><div class="cs-agenda"><time>14:00</time><span class="cs-dot" style="background:#e8b574"></span><div>产品原型迭代<small>专注时间 · 90 分钟</small></div></div><div class="cs-agenda"><time>20:00</time><span class="cs-dot" style="background:#8bc9ab"></span><div>散步与阅读<small>留一点时间给自己</small></div></div>`,'',link('完整日程','calendar'));
const note=()=>`<section class="cs-note"><div class="cs-row"><b>随手记一笔</b>${icon('pin')}</div><p style="margin:13px 0 18px">不必把每一天都填满。完成重要的事，也记得照顾好自己。</p><small>来自今天的思考</small></section>`;
const layout=(main,side)=>`<div class="cs-layout"><div class="cs-stack">${main}</div><aside class="cs-stack cs-side">${side}</aside></div>`;
const metric=(label,value,sub,c)=>`<div class="cs-color ${c}"><small>${label}</small><div class="cs-number">${value}</div><small>${sub}</small></div>`;

function tasks(){const strip=`<div class="cs-weekstrip">${['周一','周二','周三','周四','周五','周六','周日'].map((d,i)=>`<button data-day="${i}" class="${i===4?'chosen':''}"><small>${d}</small>${5+i}</button>`).join('')}</div>`;const board=`<div class="cs-grid two cs-task-board">${taskGroups.map(([title,c,items])=>`<section class="cs-color ${c}"><div class="cs-row">${tag(title)}<small>0 / 3</small></div><div style="margin-top:18px">${items.map(t=>check(...t)).join('')}</div><button class="cs-link" data-action="create">＋ 添加到「${title}」</button></section>`).join('')}</div>`;return layout(`${tabs([['board','分类看板'],['list','任务清单']],'taskView',state.taskView)}${strip}${state.taskView==='list'?panel('今日任务',table(['任务','领域','时间','状态'],taskGroups.flatMap(([cat,c,items])=>items.map(([t,d])=>[t,tag(cat,c),d.split('·')[0],tag('待开始')]))),'聚焦重要的事，有序推进。'):board}`,`${miniCal()}${panel('本周重点',goals.slice(0,3).map(g=>`<div class="cs-progress-line"><div class="cs-row"><span>${g[1]}</span><small>${g[2]}%</small></div>${progress(g[2])}</div>`).join(''),'保持一个舒服的节奏',link('目标','goals'))}${note()}`)}
function home(){return layout(`<section class="cs-vision"><div><small>早安，追光者</small><h2>今天，也向喜欢的生活<br>靠近一点。</h2><p>3 件重要的事，留一点时间给自己。</p></div><div class="cs-orbit">${icon('sun')}</div></section><div class="cs-grid">${metric('今日任务','2 / 6','已完成 · 继续从容推进','apricot')}${metric('本周进度','68%','比上周多走了一小步','lavender')}${metric('年度重点','3 项','正在认真投入','blue')}${metric('专注时光','12 天','保持自己的节奏','rose')}</div>${panel('今天，先做好这三件事',check('完成产品需求文档','工作 · 09:00 – 11:00',true)+check('剪辑并发布本周视频','创作 · 14:00 – 16:00')+check('阅读并记下一个想法','成长 · 20:00 – 20:30'),'不必做很多，先做真正重要的。',link('全部任务','tasks'))}<div class="cs-grid two">${panel('我的事业版图',table(['事业','进展'],[['独立工作室',tag('进行中','apricot')],['个人内容品牌',tag('持续经营','rose')],['AI 产品探索',tag('规划中','lavender')]]),'',link('项目','projects'))}${panel('最近的想法',`<small>今天 · 10:24</small><h3 style="margin:14px 0">专注，是把时间还给自己</h3><p class="cs-subtitle">好的计划不是安排更多，而是知道什么值得投入。</p>${tag('#个人成长')}`,'',link('思考记录','thoughts'))}</div>`,`${miniCal()}${agenda()}${note()}`)}
const lifeCards=[['身心健康','每周运动 3 次','照顾身体，也给心情充电。','blue',67,'本周 2 / 3 次'],['学习成长','读完 12 本喜欢的书','让阅读成为一种日常。','lavender',50,'6 / 12 本'],['家庭关系','和家人一起旅行','把时间留给重要的人。','rose',33,'已完成 1 / 3 个步骤'],['生活品质','拥有一个舒服的家','慢慢整理，慢慢添置。','apricot',60,'3 / 5 处空间']];
function goalsPage(){const gt=tabs([['blueprint','人生蓝图'],['annual','年度计划'],['dreams','心愿清单'],['review','回顾与调整']],'goalView',state.goalView);let main='';if(state.goalView==='blueprint'){main=`<section class="cs-vision"><div><span class="cs-caption">我的人生愿景</span><h2>自由而丰盛，<br>认真生活，持续生长。</h2><p>有健康的身体，有重要的人，也有值得投入的热爱。</p><button class="cs-pill" data-detail="调整我的人生愿景" style="margin-top:18px">${icon('pencil')}调整愿景</button></div><div class="cs-orbit">${icon('compass')}</div></section><div class="cs-domains">${['全部','身心健康','学习成长','家庭关系','生活品质','探索体验','财务安全','事业贡献'].map(a=>`<button data-area="${a}" aria-pressed="${state.area===a}">${a}</button>`).join('')}</div>${panel('今年，想实现的生活',`<div class="cs-grid two">${lifeCards.filter(g=>state.area==='全部'||g[0]===state.area).map(g=>`<section class="cs-color ${g[3]}"><div class="cs-row">${tag(g[0])}<small>年度重点</small></div><button class="cs-title" data-detail="${g[1]}">${g[1]}</button><small>${g[2]}</small><div class="cs-row" style="margin:20px 0 8px"><small>当前进展</small><b>${g[5]}</b></div>${progress(g[4])}${g[0]==='身心健康'?`<div class="cs-days">${['一','二','三','四','五','六','日'].map((d,i)=>`<button class="${[1,3].includes(i)?'done':''}" data-habit="true">${[1,3].includes(i)?'✓':d}</button>`).join('')}</div>`:check('完成下一小步','把计划落到今天')}</section>`).join('')||'<p class="cs-subtitle">这个领域可以先留白，按自己的节奏添加计划。</p>'}</div>`,'选几件在意的事，慢慢走下去。',`<button class="cs-link" data-action="create">＋ 添加计划</button>`)}`;}else if(state.goalView==='annual'){main=weeklyGoals()+panel('2026 年度计划',table(['计划','生活领域','进度','状态'],lifeCards.map(g=>[g[1],tag(g[0],g[3]),g[5]+progress(g[4]),tag('进行中','mint')])),'成果、习惯、体验，都有适合自己的推进方式。');}else if(state.goalView==='dreams'){main=panel('有一天，我想……',`<div class="cs-grid two">${[['看一次极光','探索体验','lavender','mountain-snow'],['拥有自己的小书房','生活品质','apricot','armchair'],['学会弹一首喜欢的曲子','学习成长','blue','music'],['陪家人慢慢环游','家庭关系','rose','heart']].map(([t,a,c,i])=>`<div class="cs-color ${c}"><div style="padding:30px 0;text-align:center">${icon(i)}</div><small>${a} · 有一天</small><h3>${t}</h3><button class="cs-pill" data-detail="${t}">我想开始了 ${icon('arrow-up-right')}</button></div>`).join('')}</div>`,'不着急实现，但值得好好收藏。',`<button class="cs-primary" data-action="create">＋ 记下心愿</button>`);}else{main=panel('十月，给自己一次回望',`<div class="cs-quiet"><h3>这一段时间，什么让我更接近想要的生活？</h3><p class="cs-subtitle">坚持运动，也开始给家人留出更多时间。允许自己慢一点。</p></div><div class="cs-formgrid"><label>值得记住的变化<input placeholder="写下这段时间的感受"></label><label>下一阶段的小事<input placeholder="想为自己做的一件事"></label></div><button class="cs-primary" data-local="回顾已在预览中记录" style="margin-top:20px">保存回顾</button>`)+panel('这些计划，还适合现在的我吗？',lifeCards.map(g=>`<div class="cs-setting"><span>${g[1]}</span><button class="cs-pill" data-detail="调整：${g[1]}">继续 / 调整</button></div>`).join(''));}return `${gt}${layout(main,`${panel('从期待，到行动',`<div class="cs-chain"><div><small>人生方向</small><b>身体有活力，心里有安定</b></div><div><small>今年的小目标</small><b>每周运动 3 次</b></div><div><small>回到今天</small>${check('傍晚去公园走一走','30 分钟，不赶时间')}</div></div>`)}${panel('给未来留一个位置',`<div class="cs-touchpoint">${icon('sparkles')}<div>看一次极光<small>一个期待，慢慢实现</small></div></div><div class="cs-touchpoint">${icon('book-open')}<div>拥有自己的小书房<small>为生活添一点喜欢</small></div></div>`,'',link('心愿清单','goals'))}${note()}`)}`}
const events=[['剪辑视频','晨跑 5 km','灵感记录'],['数据周报','AI 产品测试'],['整理课程笔记','散步 30 分钟'],['代码重构','修复反馈'],['产品原型迭代','周报撰写'],['线下课程','周末小旅行'],['一周回顾','安排下周']];
function calendar(){return layout(`${tabs([['week','周视图'],['month','月视图'],['day','日视图']],'calendarView',state.calendarView||'week')}${weeklyGoals()}${panel((state.calendarView||'week')==='month'?'2026 年 10 月':state.calendarView==='day'?'10 月 9 日 · 今天':'这一周的时间',state.calendarView==='day'?agenda():(state.calendarView==='month'?`<div class="cs-week">${Array.from({length:31},(_,i)=>`<div class="cs-day" style="min-height:85px"><small>${i+1}</small>${i%3===0?`<button class="cs-event lavender" data-detail="${i+1} 日的安排">${events[i%7][0]}</button>`:''}</div>`).join('')}</div>`:`<div class="cs-week progress-week">${events.map((e,i)=>`<div class="cs-day-progress"><div class="cs-row"><small>周${'一二三四五六日'[i]}</small><b>${i+5}</b></div>${progress([60,40,80,25,67,0,50][i])}<small>${[3,2,4,1,2,0,1][i]} / ${[5,5,5,4,3,3,2][i]} 完成</small></div>`).join('')}</div><div class="cs-week">${events.map((e,i)=>`<div class="cs-day ${i===4?'today':''}"><div class="cs-row"><small>周${'一二三四五六日'[i]}</small><h2>${i+5}</h2></div>${e.map((t,j)=>`<button class="cs-event ${['apricot','blue','lavender','rose','mint'][(i+j)%5]}" data-detail="${t}">${t}</button>`).join('')}</div>`).join('')}</div>`),'每天留出 2–3 件重要的事，也留一点空白。',`<span class="cs-primary">10 / 5 – 10 / 11</span>`)}<div class="cs-grid">${metric('本周安排','24 项','已完成 16 项','apricot')}${metric('连续记录','7 天','工作与生活，都有痕迹','lavender')}<div class="cs-color blue"><small>每日节奏</small>${bars([23,32,42,30,49,17,20])}</div>${metric('留白时间','6 小时','留给周末与喜欢的事','rose')}</div>`,`${miniCal()}<div class="cs-side-quote"><h3>本周高峰</h3><small>周五安排比较集中，可以提前留一点缓冲。</small></div><div class="cs-side-quote" style="border-color:#adcde9"><h3>空白窗口</h3><small>周日午后还没有安排，适合休息或复盘。</small></div>${note()}`)}
const thoughts=[['AI 不是取代，而是放大','真正的机会，是用 AI 放大自己的能力边界。保持学习，也保持主动实践。','AI · 个人成长','lavender'],['建立第二大脑的必要性','把零散想法记录下来，给它们建立连接。知识才有机会变成自己的判断。','知识管理 · 方法','blue'],['今年最后三个月，我想留下些什么','少一点新的计划，多一点认真完成。回到那些真正重要的事情。','回顾 · 人生规划','rose'],['专注力是稀缺的资源','能长时间做好一件事，本身就是一种能力。为自己创造安静的环境。','专注 · 深度工作','apricot'],['小而美的生活实验','睡前记下三件值得感谢的事，看看这会怎样改变我的注意力。','生活 · 感受','mint'],['把阅读变成自己的经验','读完后试着实践一个想法，比收藏十条金句更重要。','阅读 · 实践','lavender']];

  const grid=view==='month'?`<div class="cs-month-scroll"><div class="cs-week month-grid">${['一','二','三','四','五','六','日'].map(d=>`<small>周${d}</small>`).join('')}${Array.from({length:3},()=>'<div></div>').join('')}${Array.from({length:31},(_,i)=>`<div class="cs-day ${day===i+1?'chosen':''}" style="min-height:100px"><button data-calendar-day="${i+1}">${i+1}</button>${i%3===2?`<button class="cs-event lavender" data-calendar-day="${i+1}">${['阅读学习','项目沟通','户外散步'][i%3]}</button>`:''}</div>`).join('')}</div></div>`:view==='week'?`<div class="cs-week">${Array.from({length:7},(_,i)=>`<div class="cs-day ${day===i+5?'chosen':''}"><button data-calendar-day="${i+5}"><small>周${'一二三四五六日'[i]}</small><h2>${i+5}</h2></button>${events[i].map((t,j)=>`<button class="cs-event ${['apricot','blue','lavender'][j%3]}" data-calendar-day="${i+5}">${escapeHtml(t)}</button>`).join('')}</div>`).join('')}</div>`:'';
  const timed=calendarSamples.map(([a,b,t,c])=>{const minute=s=>Number(s.split(':')[0])*60+Number(s.split(':')[1]);return `<button class="cs-slot ${c}" style="top:${(minute(a)-480)/60*50}px;height:${(minute(b)-minute(a))/60*50-4}px" data-detail="${t}"><small>${a} – ${b}</small><b>${t}</b></button>`;}).join('');
  const timeline=panel(`10 月 ${day} 日 · 当日排程`,`<div class="cs-demo-timeline">${Array.from({length:15},(_,i)=>`<div class="cs-hour" style="top:${i*50}px"><span>${String(i+8).padStart(2,'0')}:00</span></div>`).join('')}${timed}</div>`,'5 项示例日程 · 点击日程查看详情',`<button class="cs-pill" data-action="create">＋ 添加日程</button>`);
  return layout(`${tabs([['week','周视图'],['month','月视图'],['day','日视图']],'calendarView',view)}${weeklyGoals()}${grid?panel(view==='month'?'2026 年 10 月':'这一周的时间',grid,'选择日期，查看下方当日排程'):''}${timeline}`,`${miniCal()}${panel('留给自己的空白',`<div class="cs-color mint"><h3>午后休息</h3><p>12:00 – 14:00</p></div><div class="cs-color lavender" style="margin-top:12px"><h3>今晚自由安排</h3><p>20:00 以后</p></div>`)}${note()}`);
}
renderers.calendar=calendar;
const search=document.createElement('input');search.className='cs-search';search.placeholder='搜索页面或演示记录';search.setAttribute('aria-label','搜索页面或演示记录');root.querySelector('.cs-topactions').prepend(search);
search.addEventListener('input',()=>{let box=root.querySelector('#demo-search-results');if(!search.value.trim()){box?.remove();return;}if(!box){box=document.createElement('section');box.id='demo-search-results';box.className='cs-panel cs-extra';root.querySelector('#cs-view').prepend(box);}const q=search.value.trim().toLowerCase();const found=pages.filter(p=>(p[1]+p[3]).includes(q));const records=demo.records.filter(r=>(r.title+r.body).toLowerCase().includes(q));box.innerHTML=head('搜索结果')+found.map(p=>`<p><button class="cs-link" data-page="${p[0]}">${p[1]} →</button></p>`).join('')+records.map(r=>`<p><button class="cs-link" data-edit="${r.id}">${escapeHtml(r.title)}</button></p>`).join('')+(!found.length&&!records.length?'<p>没有找到匹配的页面或演示记录。</p>':'');});
root.addEventListener('submit',event=>{if(event.target.id!=='demo-record-form')return;event.preventDefault();const data=new FormData(event.target),title=String(data.get('title')||'').trim();if(!title)return;const record={id:activeRecord||crypto.randomUUID(),page:state.page,title:title.slice(0,120),body:String(data.get('body')||'').slice(0,5000),date:String(data.get('date')||''),done:false};const existing=demo.records.find(r=>r.id===record.id);if(existing)Object.assign(existing,{...record,page:existing.page,done:existing.done});else demo.records.unshift(record);saveDemo();close();render();toast('已保存到本机演示记录');});
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.check){demo.checks[el.dataset.check]=el.checked;saveDemo();render();}else if(el.dataset.recordCheck){demo.records.find(r=>r.id===el.dataset.recordCheck).done=el.checked;saveDemo();}else if(el.dataset.profile!==undefined){demo.profile[el.dataset.profile]=el.value;if(el.dataset.profile==='0')demo.profile.name=el.value;saveDemo();root.querySelector('.cs-person b').textContent=demo.profile.name||'追光者';}});
root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.page){state.page=b.dataset.page;search.value='';render();saveDemo();window.scrollTo({top:0,behavior:'smooth'});}
  else if(b.dataset.switch){state[b.dataset.switch]=b.dataset.value;render();saveDemo();}
  else if(b.dataset.area){state.area=b.dataset.area;render();saveDemo();}
  else if(b.dataset.calendarDay){state.calendarDay=Number(b.dataset.calendarDay);render();saveDemo();}
  else if(b.dataset.edit){recordForm('编辑演示记录',demo.records.find(r=>r.id===b.dataset.edit));}
  else if(b.dataset.remove){demo.records=demo.records.filter(r=>r.id!==b.dataset.remove);saveDemo();close();render();toast('已删除演示记录');}
  else if(b.dataset.theme){demo.theme=b.dataset.theme;saveDemo();render();}
  else if(b.hasAttribute('data-add-related')){recordForm('新增演示记录');}
  else if(b.hasAttribute('data-export')||b.dataset.detail==='导出工作区数据'){const blob=new Blob([JSON.stringify({demo:true,...demo},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='chenai-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示数据');}
  else if(b.hasAttribute('data-reset')){openDialog('重置演示数据','<p>清除这个浏览器中新增的演示记录与外观设置，恢复初始演示。</p><button class="cs-primary" data-confirm-reset style="margin-top:20px">确认重置</button>');}
  else if(b.hasAttribute('data-confirm-reset')){demo={records:[],checks:{},switches:{},theme:'light',profile:{},state:{}};state.page='home';saveDemo();close();render();toast('已恢复初始演示');}
  else if(b.dataset.detail==='深色主题'){demo.theme='dark';saveDemo();render();}
  else if(b.dataset.detail==='跟随系统'){demo.theme='system';saveDemo();render();}
  else if(b.dataset.local?.includes('浅色主题')){demo.theme='light';saveDemo();render();}
  else if(b.dataset.detail){modal(b.dataset.detail,false,b.closest('tr,article,.cs-color,.cs-setting')?.innerText||b.dataset.detail);}
  else if(b.dataset.action==='create'){if(state.page==='settings'){saveDemo();toast('演示设置已保存到本机');}else if(state.page==='analytics'){modal('数据分析演示说明',false,'本页统计全部为固定示例数据，用于展示分析布局与视觉效果。');}else recordForm(pages.find(p=>p[0]===state.page)[4]);}
  else if(b.dataset.action==='notice'){modal('演示提醒',false,'今天 14:00 · 产品原型迭代\n今天 20:00 · 阅读与复盘\n10 月 18 日 · 剪映订阅续费');}
  else if(b.classList.contains('cs-close'))close();
  else if(b.dataset.local){close();toast('已记录这次演示操作');}
  else if(b.hasAttribute('data-day')){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');}
  else if(b.hasAttribute('data-habit')){b.classList.toggle('done');b.textContent=b.classList.contains('done')?'✓':'·';}
  else if(b.hasAttribute('data-post')){const ta=root.querySelector('.cs-compose textarea');if(!ta.value.trim()){ta.focus();return;}demo.records.unshift({id:crypto.randomUUID(),page:'thoughts',title:ta.value.trim().slice(0,40),body:ta.value.trim().slice(0,5000),date:'2026-10-09',done:false});saveDemo();render();toast('想法已保存到本机演示记录');}
  else if(b.getAttribute('role')==='switch'){b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true');demo.switches[b.ariaLabel]=b.getAttribute('aria-checked');saveDemo();}
});
root.addEventListener('keydown',e=>{if(root.querySelector('.cs-overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...root.querySelector('.cs-dialog').querySelectorAll('button,input,textarea,select')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
root.querySelector('.cs-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)close();});
window.addEventListener('hashchange',()=>{route();render();saveDemo();});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
render();

})();
</script>
</body></html>
